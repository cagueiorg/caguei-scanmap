[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "caguei-scanmap"
version = "0.1.0"
description = "Authorized defensive network scanner and asset mapper by caguei.org"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "caguei.org" }]
keywords = ["security", "network", "scanner", "defensive-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[project.scripts]
caguei-scanmap = "caguei_scanmap.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/caguei_scanmap"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

